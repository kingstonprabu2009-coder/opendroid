# Project-wide Gradle settings.
#
# This file is tracked in Git. The project cannot build without the settings
# below, so they cannot live in an untracked file.
#
# NEVER put signing credentials here. See gradle.properties.example for where
# those go.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
