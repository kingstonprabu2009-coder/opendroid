name: Deploy JARVIS Cloud Worker

on:
  push:
    branches:
      - jarvis/unified-brain-termux
    paths:
      - 'cloud/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check Cloud Worker
        run: npm run typecheck

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify password recovery configuration
        working-directory: .
        run: |
          response="$(curl --fail --silent --show-error https://jarvis-cloud-api.kingstonprabu2009.workers.dev/health)"
          echo "$response"
          echo "$response" | grep -q '"passwordRecovery":"configured"'
