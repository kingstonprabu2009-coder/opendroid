name: JARVIS Integrated APK Build

# Manual only: run validation first, then produce one integrated installable APK.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Validate cloud backend
        working-directory: cloud
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Validate Android unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace --no-daemon --max-workers=2

      - name: Build integrated APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Upload the single integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Integrated-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
