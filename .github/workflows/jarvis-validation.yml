name: JARVIS Validation

on:
  push:
    branches:
      - jarvis/master-brain-foundation
    paths:
      - 'app/**'
      - 'cloud/**'
      - '.github/workflows/jarvis-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-tests:
    name: Android unit tests (no APK release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests only
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace --no-daemon --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  cloud-tests:
    name: Cloud backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Typecheck and test
        working-directory: cloud
        run: |
          npm ci
          npm run typecheck
          npm test
